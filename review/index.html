<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tartary Atlas · Homepage review</title>
<style>
body{margin:0;background:#28251f;color:#f3ead7;font:14px system-ui}
header{padding:12px 20px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:#28251f;z-index:1}
button,a{padding:9px 14px;background:#eee3cc;border:0;color:#30271c;border-radius:3px;cursor:pointer;font:inherit}
a{margin-left:auto}button[aria-pressed=true]{background:#b5c8aa}main{overflow:auto;padding:15px}
iframe{display:block;width:390px;height:850px;margin:auto;border:1px solid #8a7a5b;background:#f1e5c9}
</style>
<header><strong>Homepage review</strong><button data-width="320">320 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="768">768 px</button><button data-width="1280">Desktop</button><label><input type="checkbox" id="nojs"> JavaScript off</label><a href="../docs/index.html" target="_blank">Open full preview</a></header>
<main><iframe title="Atlas responsive preview" src="../docs/index.html"></iframe></main>
<script>
const frame=document.querySelector('iframe');
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
document.getElementById('nojs').onchange=e=>{if(e.target.checked)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');frame.src=frame.getAttribute('src')};
</script></html>
