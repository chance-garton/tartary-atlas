<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Tartary storybook review</title>
<style>body{margin:0;background:#211913;color:#f0dfbd;font:14px system-ui}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #79603a}label{display:flex;align-items:center;gap:8px}select,a{font:inherit;padding:8px;background:#f0e2c2;color:#3c2c1d;border:0}main{padding:20px;overflow:auto}iframe{display:block;border:0;margin:0 auto;background:#211913}#status{font-size:12px;color:#d7b981}</style>
<header><strong>Grand Tartary · Book review</strong><label>Width<select id="width"><option>1280</option><option>1440</option><option>1024</option><option>768</option><option>700</option><option>390</option><option>320</option></select></label><label>Height<select id="height"><option>900</option><option>800</option><option>720</option><option>1100</option></select></label><label><input type="checkbox" id="noscript">No JavaScript</label><a href="../docs/" target="_blank">Open book</a><span id="status"></span></header>
<main><iframe title="Storybook responsive preview" id="view" src="../docs/" width="1280" height="900"></iframe></main>
<script>const f=document.getElementById('view'),w=document.getElementById('width'),h=document.getElementById('height'),n=document.getElementById('noscript');function measure(){try{const d=f.contentDocument;document.getElementById('status').textContent=d.documentElement.clientWidth+'px viewport / '+d.documentElement.scrollWidth+'px content'}catch(e){}}w.onchange=()=>{f.width=w.value;measure()};h.onchange=()=>{f.height=h.value;measure()};n.onchange=()=>{f.setAttribute('sandbox',n.checked?'allow-same-origin':'allow-scripts allow-same-origin');f.src='../docs/'};f.onload=measure;setInterval(measure,1500);</script></html>
