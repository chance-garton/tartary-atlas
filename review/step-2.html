<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tartary Atlas · Step 2 review</title>
<style>
body{margin:0;background:#282119;color:#f3ead7;font:14px system-ui}header{padding:12px 20px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;background:#282119;z-index:1}button,a,select{padding:9px 12px;background:#eee3cc;border:1px solid #bca77f;color:#30271c;border-radius:2px;cursor:pointer;font:inherit}a{margin-left:auto}button[aria-pressed=true]{background:#cdb47d}main{overflow:auto;padding:15px}iframe{display:block;width:390px;height:850px;margin:auto;border:1px solid #8a7a5b;background:#f1e5c9}
</style>
<header><strong>Step 2 · Reading room</strong><label>Page <select id="page"><option value="passages/">Passages</option><option value="">Homepage</option><option value="w/W168/">Source</option><option value="place/kazan/">Place</option><option value="deck/">Deck</option><option value="maps/">Maps</option><option value="dial/">Time dial</option></select></label><button data-width="320">320 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="768">768 px</button><button data-width="1280">Desktop</button><label>Theme <select id="theme"><option value="light">Parchment</option><option value="dark">Dark</option></select></label><label><input type="checkbox" id="nojs"> JavaScript off</label><a id="full" href="../docs/passages/" target="_blank">Open full preview</a></header>
<main><iframe title="Atlas responsive preview" src="../docs/passages/"></iframe></main>
<script>
const frame=document.querySelector('iframe'),page=document.getElementById('page'),theme=document.getElementById('theme');
function setTheme(){frame.contentDocument.documentElement.dataset.theme=theme.value}
frame.onload=setTheme;theme.onchange=setTheme;
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
page.onchange=()=>{frame.src='../docs/'+page.value;document.getElementById('full').href=frame.src};
document.getElementById('nojs').onchange=e=>{if(e.target.checked)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');frame.src=frame.getAttribute('src')};
</script></html>
